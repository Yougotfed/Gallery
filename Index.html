<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Send Location</title>
</head>
<body style="font-family:Arial;text-align:center;padding:30px">

<h2>📍 Send Location</h2>

<button id="send"
style="font-size:28px;padding:20px">
SEND LOCATION
</button>

<p id="status" style="font-size:20px">
Tap the button, then press Allow.
</p>

<script>
document.getElementById("send").onclick = function () {

  const status = document.getElementById("status");
  status.textContent = "Getting location...";

  if (!navigator.geolocation) {
    status.textContent = "Location is not supported.";
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const data = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy,
        time: new Date().toISOString()
      };

      status.textContent = "Sending location...";

      fetch(
        "https://webhook.site/46c77097-2601-494b-a3e4-d52e28eb6c9d",
        {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(data)
        }
      ).then(function () {
        status.textContent =
          "Location sent. Please stay where you are.";
      });

    },

    function(error) {
      status.textContent =
        "Location permission was denied. Press Allow.";
    },

    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
};
</script>

</body>
</html>
